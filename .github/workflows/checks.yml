name: Checks and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -B scripts/validate_package.py
      - run: ruff check scripts skills/swedish-k4-tax/scripts tests
      - run: ruff format --check scripts skills/swedish-k4-tax/scripts tests
      - run: mypy scripts skills/swedish-k4-tax/scripts
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/build_skill_zip.py
      - run: python -B scripts/build_skill_zip.py --check
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: matrix.python == '3.14'
        with:
          name: swedish-k4-tax
          path: |
            dist/swedish-k4-tax.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - name: Build matching release artifacts
        run: python -B scripts/build_skill_zip.py --tag "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/swedish-k4-tax.zip dist/SHA256SUMS \
            --verify-tag --title "Swedish investment tax (K4) $GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md
